name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The point of the matrix: this package shells out to Node, writes config
  # files with owner-only permissions, and drops diagnostics in the temp
  # directory. Every one of those behaved differently on Windows at some point,
  # and none of it is visible from a Linux-only run.
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Node is a hard runtime requirement: PGP operations run in a worker
      # subprocess. Installing it here also exercises the discovery path on
      # each OS, including Windows' PATHEXT handling.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # opencv + numpy are not optional here: without them the 11 CAPTCHA
          # solver tests silently skip, which is exactly the coverage we want
          # on Windows.
          pip install -e '.[gateway,captcha]' pytest ruff

      - name: Install Node deps for the PGP worker
        working-directory: proton_mail_api/decrypt
        run: npm install --no-audit --no-fund

      - name: Report the environment
        shell: bash
        run: |
          python -c "import sys, os, tempfile, shutil; print('python  :', sys.version.split()[0]); print('platform:', sys.platform); print('tempdir :', tempfile.gettempdir()); print('fchmod  :', hasattr(os, 'fchmod')); print('node    :', shutil.which('node'))"

      - name: Tests
        run: pytest tests/ -q

      # Proves the pieces the unit tests can only simulate: that Node is found
      # on this OS, that the worker handshake completes over a UTF-8 pipe, and
      # that a config survives a round trip with whatever permissions the OS
      # allows.
      - name: Smoke test the Node worker and config round trip
        shell: bash
        run: python .github/smoke.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Pinned: an unpinned ruff turns a new release into a red build on an
      # unrelated commit.
      - run: pip install 'ruff==0.14.0'
      - run: ruff check proton_mail_api tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # The wheel must carry worker.mjs and the vendored openpgp build, since
      # node_modules is deliberately untracked in git.
      - name: Verify the wheel bundles the PGP worker
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          assert 'proton_mail_api/decrypt/worker.mjs' in names, 'worker.mjs missing'
          assert any('node_modules/openpgp' in n for n in names), 'openpgp missing'
          print(f'ok: {len(names)} files, worker and openpgp present')
          EOF
